<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід | KRYLA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: radial-gradient(
                circle at 80% 20%,
                #304431,
                #101512 65%
            );
            color: #f4f1e8;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #171e19;
            border-bottom: 1px solid #39483c;
        }

        .navbar-brand {
            color: #d8e8a4 !important;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .login-section {
            min-height: calc(100vh - 75px);
            display: flex;
            align-items: center;
            padding: 50px 0;
        }

        .login-card {
            background: #1a231c;
            border: 1px solid #39483c;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .tagline {
            color: #9baa9b;
            letter-spacing: 3px;
            font-size: 12px;
        }

        .accent {
            color: #c6e38c;
        }

        .form-label {
            color: #dce5d6;
            font-weight: 600;
        }

        .form-control {
            background: #101512;
            color: white;
            border: 1px solid #39483c;
            padding: 13px;
            border-radius: 5px;
        }

        .form-control:focus {
            background: #101512;
            color: white;
            border-color: #c6e38c;
            box-shadow: none;
        }

        .btn-kryla {
            background: #c6e38c;
            color: #101512;
            font-weight: 800;
            padding: 14px;
            border: none;
            border-radius: 5px;
        }

        .btn-kryla:hover {
            background: #e0f5b2;
        }

        a {
            color: #c6e38c;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container py-2">
        <a class="navbar-brand" href="{% url 'drones:home' %}">
            KRYLA / КРИЛА
        </a>

        <a href="{% url 'drones:drone_list' %}"
           class="text-decoration-none">
            Каталог
        </a>
    </div>
</nav>

<main class="login-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">

                <div class="login-card">
                    <p class="tagline">KRYLA / ACCESS CONTROL / 004</p>

                    <h1 class="display-6 fw-bold mb-2">
                        WELCOME <span class="accent">BACK.</span>
                    </h1>

                    <p class="text-white-50 mb-4">
                        Увійди до свого облікового запису.
                    </p>

                    {% if form.errors %}
                        <div class="alert alert-danger">
                            Неправильне ім'я користувача або пароль.
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label" for="id_username">
                                Ім'я користувача
                            </label>
                            <input
                                type="text"
                                name="username"
                                id="id_username"
                                class="form-control"
                                autocomplete="username"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="id_password">
                                Пароль
                            </label>
                            <input
                                type="password"
                                name="password"
                                id="id_password"
                                class="form-control"
                                autocomplete="current-password"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-kryla w-100">
                            SIGN IN →
                        </button>
                    </form>

                    <p class="text-center text-white-50 mt-4 mb-0">
                        Ще немає акаунта?
                        <a href="{% url 'drones:register' %}">
                            Зареєструватися
                        </a>
                    </p>
                </div>

            </div>
        </div>
    </div>
</main>

</body>
</html>
